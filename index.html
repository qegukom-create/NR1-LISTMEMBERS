<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NR1 - Annuaire & Puissance</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; 
            --text: #f1f5f9; --danger: #ef4444; --accent: #10b981;
            --warning: #f59e0b; --truepower: #8b5cf6;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 5px; }

        .add-box { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .input-row { display: flex; gap: 10px; }
        input, select { background: #0f172a; border: 2px solid #334155; color: white; padding: 12px; border-radius: 10px; font-size: 16px; outline: none; transition: 0.2s; width: 100%; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--primary); }
        .input-name { flex: 2; }
        .input-power { flex: 1; }
        
        .btn-add { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box { flex: 2; }
        .sort-box { flex: 1; }

        .list-header { display: flex; justify-content: space-between; align-items: center; padding: 0 10px 10px; border-bottom: 1px solid #334155; margin-bottom: 10px; }
        .count-badge { background: #334155; padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; }

        .member-card { background: var(--card); padding: 12px 15px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border: 2px solid transparent; }
        /* Style pour les inactifs (si la date est différente d'aujourd'hui) */
        .member-card.outdated { border-color: var(--warning); background: #292524; }
        
        .member-left { display: flex; align-items: center; gap: 15px; }
        .rank-badge { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; font-size: 0.9rem; background: #334155; color: #94a3b8; flex-shrink: 0; }
        .rank-1 { background: #eab308; color: #0f172a; }
        .rank-2 { background: #cbd5e1; color: #0f172a; }
        .rank-3 { background: #cd7f32; color: #fff; }

        .member-info { display: flex; flex-direction: column; }
        .member-name { font-weight: bold; font-size: 1.05rem; }
        .member-power-row { display: flex; gap: 10px; margin-top: 2px; }
        .member-power { font-size: 0.85rem; color: var(--accent); font-weight: bold; }
        .member-true-power { font-size: 0.85rem; color: var(--truepower); font-weight: bold; }
        .member-date { font-size: 0.7rem; color: #64748b; margin-top: 2px; }
        
        .actions { display: flex; gap: 10px; align-items: center; }
        .btn-action { background: none; border: none; cursor: pointer; font-size: 1.1rem; color: #64748b; }
        .edit-zone { background: #0f172a; padding: 12px; border-radius: 8px; margin-top: -4px; margin-bottom: 8px; display: none; flex-direction: column; gap: 8px; border: 1px dashed #334155; }
        .edit-zone.active { display: flex; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>NR1 👥 ANNUAIRE</h1>
    </div>

    <div class="add-box">
        <div class="input-group">
            <div class="input-row">
                <input type="text" id="m-name" class="input-name" placeholder="Nom...">
                <input type="number" id="m-power" class="input-power" placeholder="Puiss (M)">
                <input type="number" id="m-truepower" class="input-power" placeholder="True (M)">
            </div>
        </div>
        <button class="btn-add" onclick="addMember()">Ajouter</button>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="search-member" placeholder="🔍 Rechercher..." oninput="renderList()">
        </div>
        <div class="sort-box">
            <select id="sort-by" onchange="renderList()">
                <option value="power">Tri : Puissance</option>
                <option value="truePower">Tri : True Power</option>
            </select>
        </div>
    </div>

    <div class="list-header">
        <span>Membres classés</span>
        <span class="count-badge" id="member-count">0</span>
    </div>

    <div id="memberList"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA8edMWQreJMKrbS8MuowKZl58x7W5vfBU",
        authDomain: "nr1-vikings.firebaseapp.com",
        databaseURL: "https://nr1-vikings-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "nr1-vikings"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const membersRef = db.ref('alliance_database');

    let allMembers = [];

    // Helper pour date
    const getToday = () => new Date().toISOString().split('T')[0];

    membersRef.on('value', (snap) => {
        const data = snap.val();
        allMembers = data ? Object.keys(data).map(id => ({ id, ...data[id] })) : [];
        renderList();
    });

    function renderList() {
        const query = document.getElementById('search-member').value.toLowerCase();
        const sortBy = document.getElementById('sort-by').value;
        const display = document.getElementById('memberList');
        const today = getToday();
        
        display.innerHTML = "";
        
        const filtered = allMembers
            .filter(m => m.name.toLowerCase().includes(query))
            .sort((a, b) => (b[sortBy] || 0) - (a[sortBy] || 0));

        document.getElementById('member-count').innerText = filtered.length;

        filtered.forEach((m, index) => {
            const rank = index + 1;
            const rankClass = rank <= 3 ? `rank-${rank}` : "";
            const isOutdated = m.lastUpdate !== today;
            
            display.innerHTML += `
                <div class="member-card ${isOutdated ? 'outdated' : ''}" id="card-${m.id}">
                    <div class="member-left">
                        <div class="rank-badge ${rankClass}">${rank}</div>
                        <div class="member-info">
                            <span class="member-name">${m.name} ${isOutdated ? '⚠️' : ''}</span>
                            <div class="member-power-row">
                                <span class="member-power">P: ${m.power || 0}M</span>
                                <span class="member-true-power">TP: ${m.truePower || 0}M</span>
                            </div>
                            <span class="member-date">Dernière MàJ : ${m.lastUpdate || 'Jamais'}</span>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn-action" onclick="toggleEdit('${m.id}')">✎</button>
                        <button class="btn-action" onclick="removeMember('${m.id}')">✕</button>
                    </div>
                </div>
                <div id="edit-${m.id}" class="edit-zone">
                    <input type="number" id="new-power-${m.id}" value="${m.power || 0}">
                    <input type="number" id="new-truepower-${m.id}" value="${m.truePower || 0}">
                    <button class="btn-add" onclick="updateMember('${m.id}')">Enregistrer</button>
                </div>
            `;
        });
    }

    function addMember() {
        const name = document.getElementById('m-name').value;
        if (!name) return;
        membersRef.push({ 
            name, 
            power: parseFloat(document.getElementById('m-power').value) || 0,
            truePower: parseFloat(document.getElementById('m-truepower').value) || 0,
            lastUpdate: getToday()
        });
    }

    function updateMember(id) {
        membersRef.child(id).update({
            power: parseFloat(document.getElementById('new-power-'+id).value),
            truePower: parseFloat(document.getElementById('new-truepower-'+id).value),
            lastUpdate: getToday() // C'est ici que la date se met à jour
        });
        toggleEdit(id);
    }

    function toggleEdit(id) { document.getElementById('edit-'+id).classList.toggle('active'); }
    function removeMember(id) { if(confirm("Supprimer ?")) membersRef.child(id).remove(); }
</script>
</body>
</html>
