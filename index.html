<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NR1 - Annuaire & Puissance</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; 
            --text: #f1f5f9; --danger: #ef4444; --accent: #10b981;
            --warning: #f59e0b; --truepower: #8b5cf6;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 5px; }

        .add-box { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .input-row { display: flex; gap: 10px; }
        input, select { background: #0f172a; border: 2px solid #334155; color: white; padding: 12px; border-radius: 10px; font-size: 16px; outline: none; transition: 0.2s; width: 100%; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--primary); }
        .input-name { flex: 2; }
        .input-power { flex: 1; }
        
        .checkbox-container { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; margin-top: 5px; }
        .checkbox-container input { width: 18px; height: 18px; cursor: pointer; }

        .btn-add { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        .btn-secondary { background: #334155; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-top: 10px; transition: 0.2s; }
        .btn-secondary:hover { background: #475569; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box { flex: 2; }
        .sort-box { flex: 1; }

        .list-header { display: flex; justify-content: space-between; align-items: center; padding: 0 10px 10px; border-bottom: 1px solid #334155; margin-bottom: 10px; }
        .count-badge { background: #334155; padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; }

        .member-card { background: var(--card); padding: 12px 15px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border: 2px solid transparent; }
        .member-card.outdated { border-color: var(--warning); background: #292524; }
        
        .member-left { display: flex; align-items: center; gap: 15px; }
        .rank-badge { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; font-size: 0.9rem; background: #334155; color: #94a3b8; flex-shrink: 0; }
        .rank-1 { background: #eab308; color: #0f172a; }
        .rank-2 { background: #cbd5e1; color: #0f172a; }
        .rank-3 { background: #cd7f32; color: #fff; }

        .member-info { display: flex; flex-direction: column; }
        .member-name { font-weight: bold; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
        .member-power-row { display: flex; gap: 10px; margin-top: 2px; }
        .member-power { font-size: 0.85rem; color: var(--accent); font-weight: bold; }
        .member-true-power { font-size: 0.85rem; color: var(--truepower); font-weight: bold; }
        .member-date { font-size: 0.7rem; color: #64748b; margin-top: 2px; }
        
        .actions { display: flex; gap: 10px; align-items: center; }
        .btn-action { background: none; border: none; cursor: pointer; font-size: 1.1rem; color: #64748b; }
        .edit-zone { background: #0f172a; padding: 12px; border-radius: 8px; margin-top: -4px; margin-bottom: 8px; display: none; flex-direction: column; gap: 8px; border: 1px dashed #334155; }
        .edit-zone.active { display: flex; }

        /* Styles pour la vue Répartition en 2 colonnes */
        .split-container { display: flex; gap: 15px; margin-top: 15px; }
        .split-col { flex: 1; background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .split-col h3 { margin-top: 0; color: var(--primary); font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .split-summary { font-size: 0.8rem; background: #334155; padding: 2px 8px; border-radius: 10px; color: #f1f5f9; }
        .split-list { display: flex; flex-direction: column; gap: 6px; max-height: 500px; overflow-y: auto; }
        .split-item { background: #0f172a; padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; font-size: 0.9rem; align-items: center; }
        .split-item-name { font-weight: 500; }
        .split-item-power { color: var(--accent); font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>NR1 👥 ANNUAIRE</h1>
    </div>

    <div class="add-box">
        <div class="input-group">
            <div class="input-row">
                <input type="text" id="m-name" class="input-name" placeholder="Nom...">
                <input type="number" id="m-power" class="input-power" placeholder="Puiss (M)">
                <input type="number" id="m-truepower" class="input-power" placeholder="True (M)">
            </div>
            <label class="checkbox-container">
                <input type="checkbox" id="m-isnr1" checked> Membre NR1
            </label>
        </div>
        <button class="btn-add" onclick="addMember()">Ajouter</button>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="search-member" placeholder="🔍 Rechercher..." oninput="renderList()">
        </div>
        <div class="sort-box">
            <select id="sort-by" onchange="renderList()">
                <option value="power">Tri : Puissance</option>
                <option value="truePower">Tri : True Power</option>
            </select>
        </div>
    </div>

    <button class="btn-secondary" onclick="toggleView()" id="btn-toggle-view">📊 Vue Répartition</button>

    <div id="standard-view">
        <div class="list-header" style="margin-top: 20px;">
            <span>Membres classés</span>
            <span class="count-badge" id="member-count">0</span>
        </div>
        <div id="memberList"></div>
    </div>

    <div id="split-view" style="display: none;">
        <div class="split-container">
            <div class="split-col">
                <h3>NR1 <span class="split-summary" id="nr1-summary">0j - 0M</span></h3>
                <div class="split-list" id="col-nr1"></div>
            </div>
            <div class="split-col">
                <h3>Non NR1 <span class="split-summary" id="non-nr1-summary">0j - 0M</span></h3>
                <div class="split-list" id="col-non-nr1"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA8edMWQreJMKrbS8MuowKZl58x7W5vfBU",
        authDomain: "nr1-vikings.firebaseapp.com",
        databaseURL: "https://nr1-vikings-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "nr1-vikings"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const membersRef = db.ref('alliance_database');

    let allMembers = [];
    let isSplitView = false;

    // Helper pour date
    const getToday = () => new Date().toISOString().split('T')[0];

    membersRef.on('value', (snap) => {
        const data = snap.val();
        allMembers = data ? Object.keys(data).map(id => ({ id, ...data[id] })) : [];
        renderList();
    });

    function toggleView() {
        isSplitView = !isSplitView;
        const standardView = document.getElementById('standard-view');
        const splitView = document.getElementById('split-view');
        const btn = document.getElementById('btn-toggle-view');

        if (isSplitView) {
            standardView.style.display = 'none';
            splitView.style.display = 'block';
            btn.innerText = "📋 Vue Annuaire";
            renderSplitView();
        } else {
            standardView.style.display = 'block';
            splitView.style.display = 'none';
            btn.innerText = "📊 Vue Répartition";
            renderList();
        }
    }

    function renderList() {
        if (isSplitView) {
            renderSplitView();
            return;
        }

        const query = document.getElementById('search-member').value.toLowerCase();
        const sortBy = document.getElementById('sort-by').value;
        const display = document.getElementById('memberList');
        const today = getToday();
        
        display.innerHTML = "";
        
        const filtered = allMembers
            .filter(m => m.name.toLowerCase().includes(query))
            .sort((a, b) => (b[sortBy] || 0) - (a[sortBy] || 0));

        document.getElementById('member-count').innerText = filtered.length;

        filtered.forEach((m, index) => {
            const rank = index + 1;
            const rankClass = rank <= 3 ? `rank-${rank}` : "";
            const isOutdated = m.lastUpdate !== today;
            const nr1Badge = m.isNR1 ? '<span title="Membre NR1">⭐</span>' : '';
            
            display.innerHTML += `
                <div class="member-card ${isOutdated ? 'outdated' : ''}" id="card-${m.id}">
                    <div class="member-left">
                        <div class="rank-badge ${rankClass}">${rank}</div>
                        <div class="member-info">
                            <span class="member-name">${m.name} ${nr1Badge} ${isOutdated ? '⚠️' : ''}</span>
                            <div class="member-power-row">
                                <span class="member-power">P: ${m.power || 0}M</span>
                                <span class="member-true-power">TP: ${m.truePower || 0}M</span>
                            </div>
                            <span class="member-date">Dernière MàJ : ${m.lastUpdate || 'Jamais'}</span>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn-action" onclick="toggleEdit('${m.id}')">✎</button>
                        <button class="btn-action" onclick="removeMember('${m.id}')">✕</button>
                    </div>
                </div>
                <div id="edit-${m.id}" class="edit-zone">
                    <input type="number" id="new-power-${m.id}" value="${m.power || 0}" placeholder="Puissance">
                    <input type="number" id="new-truepower-${m.id}" value="${m.truePower || 0}" placeholder="True Power">
                    <label class="checkbox-container">
                        <input type="checkbox" id="new-isnr1-${m.id}" ${m.isNR1 ? 'checked' : ''}> Membre NR1
                    </label>
                    <button class="btn-add" onclick="updateMember('${m.id}')">Enregistrer</button>
                </div>
            `;
        });
    }

    function renderSplitView() {
        const colNr1 = document.getElementById('col-nr1');
        const colNonNr1 = document.getElementById('col-non-nr1');
        
        colNr1.innerHTML = "";
        colNonNr1.innerHTML = "";

        // Trier tous les membres par puissance décroissante par défaut pour la répartition
        const sorted = [...allMembers].sort((a, b) => (b.power || 0) - (a.power || 0));

        let nr1Count = 0, nr1PowerSum = 0;
        let nonNr1Count = 0, nonNr1PowerSum = 0;

        sorted.forEach(m => {
            const power = m.power || 0;
            const itemHTML = `
                <div class="split-item">
                    <span class="split-item-name">${m.name}</span>
                    <span class="split-item-power">${power}M</span>
                </div>
            `;

            if (m.isNR1) {
                nr1Count++;
                nr1PowerSum += power;
                colNr1.innerHTML += itemHTML;
            } else {
                nonNr1Count++;
                nonNr1PowerSum += power;
                colNonNr1.innerHTML += itemHTML;
            }
        });

        document.getElementById('nr1-summary').innerText = `${nr1Count} joueur${nr1Count > 1 ? 's' : ''} - ${nr1PowerSum}M`;
        document.getElementById('non-nr1-summary').innerText = `${nonNr1Count} joueur${nonNr1Count > 1 ? 's' : ''} - ${nonNr1PowerSum}M`;
    }

    function addMember() {
        const name = document.getElementById('m-name').value;
        if (!name) return;
        membersRef.push({ 
            name, 
            power: parseFloat(document.getElementById('m-power').value) || 0,
            truePower: parseFloat(document.getElementById('m-truepower').value) || 0,
            isNR1: document.getElementById('m-isnr1').checked,
            lastUpdate: getToday()
        });
        // Réinitialiser les champs de saisie
        document.getElementById('m-name').value = '';
        document.getElementById('m-power').value = '';
        document.getElementById('m-truepower').value = '';
        document.getElementById('m-isnr1').checked = true;
    }

    function updateMember(id) {
        membersRef.child(id).update({
            power: parseFloat(document.getElementById('new-power-'+id).value) || 0,
            truePower: parseFloat(document.getElementById('new-truepower-'+id).value) || 0,
            isNR1: document.getElementById('new-isnr1-'+id).checked,
            lastUpdate: getToday()
        });
        toggleEdit(id);
    }

    function toggleEdit(id) { document.getElementById('edit-'+id).classList.toggle('active'); }
    function removeMember(id) { if(confirm("Supprimer ?")) membersRef.child(id).remove(); }
</script>
</body>
</html>
